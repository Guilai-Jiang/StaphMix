[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "staphmix"
dynamic = ["version"]
description = "One-stop cgMLST, virulence, resistance and SCCmec typing for Staphylococcus aureus genomes"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "COPYING"]
authors = [
    { name = "Guilai Jiang", email = "gljiang@alu.suda.edu.cn" },
    { name = "Zhemin Zhou" },
]
keywords = ["bioinformatics", "staphylococcus aureus", "cgMLST", "SCCmec", "AMR", "VFDB"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy",
    "pandas",
    "numba",
    "biopython",
    "click",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Guilai-Jiang/StaphMix"
Source = "https://github.com/Guilai-Jiang/StaphMix"
Issues = "https://github.com/Guilai-Jiang/StaphMix/issues"

[project.scripts]
staphmix = "staphmix.cli:main"

[tool.setuptools.dynamic]
version = { attr = "staphmix.__version__" }

[tool.setuptools.packages.find]
include = ["staphmix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
